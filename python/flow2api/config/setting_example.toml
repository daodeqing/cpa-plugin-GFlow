[global]
api_key = "han1234"
admin_username = "admin"
admin_password = "admin"

[flow]
labs_base_url = "https://flow.google.com"
api_base_url = "https://flow.google.com"
timeout = 120
max_retries = 3
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500

[call_logic]
call_mode = "default"  # default=random rotation, polling=sequential rotation

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # Cache timeout (seconds), default 2 hours; 0 disables automatic cache deletion
base_url = ""   # Base URL for cached files; leave empty to use the server address

[captcha]
captcha_method = "yescaptcha"  # Captcha solving method: yescaptcha/captcharun/twocaptcha/capsolver/ezcaptcha/browser/personal/remote_browser
browser_recaptcha_settle_seconds = 3.0  # Extra settling time after reload/clr is ready for custom site score tests
browser_flow_page_warmup_seconds = 6.0  # Settling time after browser harvest opens the Flow page
browser_count = 1  # Number of headed browser instances in browser mode
browser_captcha_max_retries = 5  # Maximum retries per captcha token request in browser mode
browser_captcha_generation_retries = 6  # Total retries when the generation API reports reCAPTCHA evaluation failed
personal_solve_strategy = "auto"  # auto=prefer trusted JS, fall back to native harvest on failure; direct/harvest forces a strategy
personal_project_pool_size = 4  # Default project pool size per Token in personal mode (affects project rotation only, not captcha tab count)
personal_max_resident_tabs = 5  # Shared captcha tab limit in personal mode; all Token/project pairs share these tabs
browser_personal_fresh_restart_every_n_solves = 10  # Successful solves before browser cleanup and restart in personal mode; 0 disables this
personal_idle_tab_ttl_seconds = 600  # Idle tab cleanup time in personal mode (seconds)
yescaptcha_api_key = ""  # YesCaptcha API key
yescaptcha_base_url = "https://api.yescaptcha.com"
yescaptcha_task_type = "RecaptchaV3TaskProxylessM1S9"  # Options: RecaptchaV3TaskProxyless/RecaptchaV3TaskProxylessM1/RecaptchaV3TaskProxylessM1S7/RecaptchaV3TaskProxylessM1S9
remote_browser_base_url = ""  # Remote headed captcha service URL
remote_browser_api_key = ""   # Remote headed captcha service API Key
remote_browser_timeout = 60   # Remote headed captcha request timeout (seconds)
capsolver_api_key = ""
capsolver_base_url = "https://api.capsolver.com"
captcharun_api_key = ""
captcharun_base_url = "https://api.captcha-run.com"

twocaptcha_api_key = ""
twocaptcha_base_url = "https://api.2captcha.com"
